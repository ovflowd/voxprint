[project]
name = "voxprint-app"
version = "0.1.1"
description = "The Voxprint app: turns one utterance into a speaker embedding, keeping nothing"
readme = "README.md"
license = "MIT"
authors = [{ name = "Claudio Wunder", email = "cwunder@gnome.org" }]
requires-python = ">=3.14"
dependencies = [
    "aiohttp==3.14.5",
    "kaldi-native-fbank==1.23.0",
    "numpy==2.5.4",
    "onnxruntime==1.31.1",
]

[dependency-groups]
dev = [
    "pytest>=9",
    "pytest-aiohttp>=1.1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
