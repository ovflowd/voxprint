version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      # Everything here is for development, and pytest-homeassistant pins Home Assistant itself, so one
      # pull request moves them together.
      dev:
        patterns:
          - "*"
  - package-ecosystem: uv
    directory: /app
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      dev:
        dependency-type: development
  - package-ecosystem: docker
    directory: /app
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
